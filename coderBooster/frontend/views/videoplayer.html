<!-- Video View -->
<div class="view-container">
    <!-- Main Video Section with Chat Layout -->
    <div class="video-chat-layout">
        <!-- Left Column: Video Content -->
        <div class="video-content">
            <!-- Video Player -->
            <div class="video-container mb-4">
                <div class="video-placeholder bg-dark rounded d-flex align-items-center justify-content-center" style="height: 400px;">
                    <div class="text-center text-white">
                        <i class="bi bi-play-circle-fill display-1"></i>
                        <h5 class="mt-3">Video Player</h5>
                        <p class="text-muted">Select a video to start watching</p>
                    </div>
                </div>
            </div>

            <!-- Video Info -->
            <div class="video-info mb-4">
                <div class="video-info-container">
                    <h3 class="fw-bold" id="videoTitle">Python Fundamentals - Variables and Data Types</h3>
                    <div class="d-flex align-items-center gap-4 text-muted">
                        <span><i class="bi bi-clock me-1"></i>45:32</span>
                        <span><i class="bi bi-calendar me-1"></i>2 days ago</span>
                    </div>
                </div>
            </div>
            
            <!-- Comments Section - Same width as video -->
            <div class="comments-section">
                <div class="card">
                    <div class="card-body">
                        <div id="comentarios">
                            <h3>Comments</h3>

                            <div id="listaComentarios">
                                <!-- Comentarios aquí -->
                            </div>

                            <textarea id="nuevoComentario" placeholder="Write your comment..."></textarea>
                            
                            <button id="btnPublicar">Publicar</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Right Column: Chat Space (Future Implementation) -->
        <div class="chat-space">
            <div class="chat-placeholder">
                <div class="text-center text-muted py-5">
                    <i class="bi bi-chat-dots display-4"></i>
                    <h5 class="mt-3">AI Chat Assistant</h5>
                    <p class="mb-0">Chat functionality coming soon!</p>
                    <small class="text-muted">Ask questions about the video content</small>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module" src="../features/comments/main.js"></script>
