<!-- Home View -->
<div class="view-container">
    <!-- Logo CoderBoost -->
    <div class="text-center mb-5">
        <div class="d-inline-flex align-items-center justify-content-center mb-0">
            <img src="../assets/images/LogolargoCoderBoost.png" alt="CoderBoost Logo" class="logo-main">
        </div>
    </div>

    <!-- AI Welcome Section -->
    <div class="welcome-section rounded-4 p-4 mb-4 mt-1 text-white">
        <div class="d-flex align-items-center mb-4">
            <div class="welcome-icon me-3">
                <i class="bi bi-chat-dots-fill fs-4"></i>
            </div>
            <div>
                <h2 class="h3 fw-bold mb-1">Welcome back, Coder! 👋</h2>
                <p class="text-white-50 mb-0">Ready to boost your programming skills today?</p>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="position-relative">
            <input type="text" id="search-input" placeholder="Search workshops, topics, or ask me anything..."
                class="form-control search-input">
            <button id="searchbtn" class="btn search-btn">
                <i class="bi bi-search"></i>
            </button>
        </div>
    </div>

        <!-- Contenedor para resultados -->
    <div id="searchResults" class="mt-3">
        <!-- Aquí aparecerán los resultados de la búsqueda -->
    </div>

    <!-- Workshop Categories -->
    <div class="mb-4">
        <h3 class="h4 fw-bold text-primary mb-3">Workshop Categories</h3>
        <div class="row g-3">
            <div class="col-md-4">
                <div class="category-card">
                    <div class="category-icon bg-primary">
                        <span class="fs-1">🐍</span>
                    </div>
                    <h5 class="mt-3 mb-1">Python</h5>
                    <p class="text-muted small mb-0">Data Science & Web Dev</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="category-card">
                    <div class="category-icon bg-success">
                        <span class="fs-1">⚛️</span>
                    </div>
                    <h5 class="mt-3 mb-1">React</h5>
                    <p class="text-muted small mb-0">Frontend Development</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="category-card">
                    <div class="category-icon bg-warning">
                        <span class="fs-1">🗄️</span>
                    </div>
                    <h5 class="mt-3 mb-1">Databases</h5>
                    <p class="text-muted small mb-0">SQL & Data Modeling</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="category-card">
                    <div class="category-icon bg-danger">
                        <span class="fs-1">🎨</span>
                    </div>
                    <h5 class="mt-3 mb-1">CSS</h5>
                    <p class="text-muted small mb-0">Styling & Layout</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="category-card">
                    <div class="category-icon bg-info">
                        <span class="fs-1">📄</span>
                    </div>
                    <h5 class="mt-3 mb-1">HTML</h5>
                    <p class="text-muted small mb-0">Web Structure</p>
                </div>
            </div>
            <div class="col-md-4">
                <div class="category-card">
                    <div class="category-icon bg-secondary">
                        <span class="fs-1">✨</span>
                    </div>
                    <h5 class="mt-3 mb-1">JavaScript</h5>
                    <p class="text-muted small mb-0">Programming Logic</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Recent Workshops -->
    <div class="mb-4">
        <h3 class="h4 fw-bold text-primary mb-3">Recent Workshops</h3>
        <div class="row g-3" id="recentWorkshopsGrid">
            <!-- Recent workshops will be loaded here -->
        </div>
    </div>
</div>
